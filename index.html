<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Cadastro de Alunos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sistema de Cadastro de Alunos</h1>
        <p>Cadastro Acadêmico</p>
        <img
            class="imagem-cabecalho"
            src="assets/imagem-cabecalho.png"
            alt="Imagem decorativa no cabeçalho"
        >
    </header>

    <main>

        <div class="card">

            <h2>Novo Aluno</h2>

            <div class="campo">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome do aluno"
                >

            </div>


            <div class="campo">

                <label for="idade">
                    Idade
                </label>

                <input
                    type="number"
                    id="idade"
                    placeholder="Digite a idade"
                >

            </div>


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="text"
                    id="email"
                    placeholder="exemplo@email.com"
                >

            </div>


            <div class="campo">

                <label for="curso">
                    Curso
                </label>

                <select id="curso">

                    <option value="">
                        Selecione um curso
                    </option>

                    <option value="Informática">
                        Informática
                    </option>

                    <option value="Administração">
                        Administração
                    </option>

                    <option value="Logística">
                        Logística
                    </option>

                    <option value="Desenvolvimento de Sistemas">
                        Desenvolvimento de Sistemas
                    </option>

                </select>

            </div>


            <button onclick="cadastrarAluno()">
                Cadastrar
            </button>


            <div id="mensagem"></div>

        </div>


        <div class="card">

            <h2>Alunos cadastrados</h2>

            <table>

                <thead>

                    <tr>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>E-mail</th>
                        <th>Curso</th>
                    </tr>

                </thead>

                <tbody id="listaAlunos">

                </tbody>

            </table>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
